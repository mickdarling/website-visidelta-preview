<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <link id="dark-theme" rel="stylesheet" href="/admin/dark.css" />
  <style>
    #theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99999;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #theme-toggle:hover {
      background: #30363d;
    }
    #theme-toggle.light-mode {
      background: #ffffff;
      color: #24292f;
      border-color: #d0d7de;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #theme-toggle.light-mode:hover {
      background: #f6f8fa;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()">
    <span id="theme-icon">☀️</span>
    <span id="theme-text">Light</span>
  </button>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    function toggleTheme() {
      const darkSheet = document.getElementById('dark-theme');
      const toggleBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.getElementById('theme-text');

      if (darkSheet.disabled) {
        darkSheet.disabled = false;
        toggleBtn.classList.remove('light-mode');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light';
        localStorage.setItem('decap-theme', 'dark');
      } else {
        darkSheet.disabled = true;
        toggleBtn.classList.add('light-mode');
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark';
        localStorage.setItem('decap-theme', 'light');
      }
    }

    // Load saved preference on page load
    (function() {
      const savedTheme = localStorage.getItem('decap-theme');
      const darkSheet = document.getElementById('dark-theme');
      const toggleBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.getElementById('theme-text');

      if (savedTheme === 'light') {
        darkSheet.disabled = true;
        toggleBtn.classList.add('light-mode');
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark';
      }
    })();
  </script>
</body>
</html>
