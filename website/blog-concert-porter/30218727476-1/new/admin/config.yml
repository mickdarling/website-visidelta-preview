backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: develop

media_folder: static/images
public_folder: /images

collections:
  - name: "published"
    label: "Published Posts"
    folder: "content/published"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
      - {label: "Created Date", name: "created", widget: "datetime"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime", required: false}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "drafts"
    label: "Drafts"
    folder: "content/drafts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
      - {label: "Created Date", name: "created", widget: "datetime"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime", required: false}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "review"
    label: "In Review"
    folder: "content/review"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
      - {label: "Created Date", name: "created", widget: "datetime"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime", required: false}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "scheduled"
    label: "Scheduled"
    folder: "content/scheduled"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
      - {label: "Created Date", name: "created", widget: "datetime"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime", required: false}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "private"
    label: "Private Notes"
    folder: "content/private"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
      - {label: "Created Date", name: "created", widget: "datetime"}
      - {label: "Description", name: "description", widget: "string", required: false}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
          - {label: "Created Date", name: "created", widget: "datetime"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Tags", name: "tags", widget: "list", default: []}
          - {label: "Body", name: "body", widget: "markdown"}
      - label: "Work"
        name: "work"
        file: "content/work.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Author", name: "author", widget: "string", default: "Mick Darling"}
          - {label: "Created Date", name: "created", widget: "datetime"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Tags", name: "tags", widget: "list", default: []}
          - {label: "Body", name: "body", widget: "markdown"}
